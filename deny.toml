# cargo deny: checked in CI (`deny` job). Spikes keep their own lockfile and
# aren't covered.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported, but only for direct dependencies; a yanked
# version fails.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licences only. A new one in the tree fails until it's added here.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "WTFPL",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
