name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Which jobs a pull request needs, from the files it changes. A job left
  # out shows as skipped, which counts as passed for the required checks; a
  # `paths:` filter on the workflow would leave them pending instead. Pushes
  # to main run everything.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.filter.outputs.linux }}
      macos: ${{ steps.filter.outputs.macos }}
      spike: ${{ steps.filter.outputs.spike }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          shared='Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$'
          declare -A patterns=(
            [linux]="^(crates/|assets/|\.devcontainer/|scripts/e2e-fake-host\.sh$|$shared)"
            [macos]="^(crates/|assets/|packaging/macos/|scripts/mac\.zsh$|$shared)"
            [spike]="^(spikes/m0/|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)"
          )
          # Everything runs unless the diff is known: a failure here must
          # not turn into skipped (= passed) checks.
          all=true
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only "$BASE...$HEAD"); then
            all=false
            echo "$files"
          fi
          for job in "${!patterns[@]}"; do
            if $all || grep -qE "${patterns[$job]}" <<<"$files"; then
              echo "$job=true" >> "$GITHUB_OUTPUT"; echo "$job: runs"
            else
              echo "$job=false" >> "$GITHUB_OUTPUT"; echo "$job: skipped"
            fi
          done

  workspace-linux:
    name: workspace (Linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    # In the devcontainer image: the client needs ffmpeg 9 and SDL3.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          tags: aetherdesk-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: fmt, clippy, test, end-to-end against the fake host
        run: |
          # NET_ADMIN: the e2e narrows the loopback's MTU for one check.
          docker run --rm --cap-add=NET_ADMIN -v "$PWD:/w:ro" -w /w \
            -e CARGO_TARGET_DIR=/tmp/target -e CARGO_TERM_COLOR -e RUSTFLAGS \
            aetherdesk-dev bash -c '
              set -e
              cargo fmt --all --check
              cargo clippy --workspace --all-targets --locked
              cargo test --workspace --locked
              cargo build -p aetherdesk-linux-client --bins --examples --features test-hooks --locked
              scripts/e2e-fake-host.sh'

  workspace-macos:
    name: workspace (macOS)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: Syntax of the scripts that only run on release
        run: |
          for f in packaging/macos/*.sh packaging/macos/pkg/scripts/*; do bash -n "$f"; done
          zsh -n scripts/mac.zsh
      # What the release does, without the secrets: ad hoc signed, unsigned
      # package, no updater key.
      - name: Build AetherDesk.app (with Sparkle) and the .pkg
        run: |
          cargo build -p aetherdesk-mac-host --locked
          packaging/macos/app-bundle.sh target/debug/aether-agent "$RUNNER_TEMP/app"
          packaging/macos/build-pkg.sh "$RUNNER_TEMP/app/AetherDesk.app" "$RUNNER_TEMP/pkg"
          test -d "$RUNNER_TEMP/app/AetherDesk.app/Contents/Frameworks/Sparkle.framework"
          test -d "$RUNNER_TEMP/app/AetherDesk.app/Contents/PlugIns/AetherDesk.driver"
      # The runner's sudo needs no password: install the package for real,
      # check what the postinstall set up, then uninstall it again.
      - name: Install the .pkg, check it, uninstall
        run: |
          app=/Applications/AetherDesk.app
          daemon=system/nl.stormlantern.aetherdesk.daemon
          sudo installer -pkg "$RUNNER_TEMP"/pkg/AetherDesk-*.pkg -target / ||
            { tail -n 40 /var/log/install.log; exit 1; }
          codesign --verify --deep --strict "$app"
          test "$(cat '/Library/Application Support/AetherDesk/install-source')" = pkg
          test "$(readlink /usr/local/bin/aether-agent)" = "$app/Contents/MacOS/aether-agent"
          test -d /Library/Audio/Plug-Ins/HAL/AetherDesk.driver
          for f in daemon agent loginwindow menu; do
            plutil -lint /Library/Launch*/nl.stormlantern.aetherdesk.$f.plist
          done
          running=false
          for _ in $(seq 50); do
            if launchctl print "$daemon" 2>/dev/null | grep -q 'state = running'; then
              running=true; break
            fi
            sleep 0.2
          done
          $running || { launchctl print "$daemon" || true; cat /Library/Logs/AetherDesk/daemon.log || true; exit 1; }
          aether-agent version
          sudo "$app/Contents/MacOS/aether-agent" _uninstall-root
          test ! -e "$app"
          test ! -e /usr/local/bin/aether-agent
          test ! -e /Library/LaunchDaemons/nl.stormlantern.aetherdesk.daemon.plist
          test ! -e /Library/Audio/Plug-Ins/HAL/AetherDesk.driver
          if launchctl print "$daemon" >/dev/null 2>&1; then echo "daemon still loaded"; exit 1; fi
          if pkgutil --pkg-info nl.stormlantern.aetherdesk.pkg >/dev/null 2>&1; then
            echo "package receipt still there"; exit 1
          fi

  spike-m0:
    name: spike-m0 (macOS)
    needs: changes
    if: needs.changes.outputs.spike == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: spikes/m0
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/m0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo build --locked
      - name: zsh syntax of mac/m0.zsh
        run: zsh -n mac/m0.zsh
