name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  workspace-linux:
    name: workspace (Linux)
    # In the devcontainer image: the client needs ffmpeg 9 and SDL3.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          tags: aetherdesk-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: fmt, clippy, test, end-to-end against the fake host
        run: |
          # NET_ADMIN: the e2e narrows the loopback's MTU for one check.
          docker run --rm --cap-add=NET_ADMIN -v "$PWD:/w:ro" -w /w \
            -e CARGO_TARGET_DIR=/tmp/target -e CARGO_TERM_COLOR -e RUSTFLAGS \
            aetherdesk-dev bash -c '
              set -e
              cargo fmt --all --check
              cargo clippy --workspace --all-targets --locked
              cargo test --workspace --locked
              cargo build -p aetherdesk-linux-client --bins --examples --features test-hooks --locked
              scripts/e2e-fake-host.sh'

  workspace-macos:
    name: workspace (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  spike-m0:
    name: spike-m0 (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: spikes/m0
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/m0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo build --locked
      - name: zsh syntax of mac/m0.zsh
        run: zsh -n mac/m0.zsh
