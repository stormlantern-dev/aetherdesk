name: Release

# Pushing a v* tag builds the Linux client and attaches a tarball to the
# GitHub release for that tag (created if it doesn't exist yet).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-client:
    name: Linux client tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the workspace version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          crate=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match workspace version $crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      # Same image as CI: Arch, with the SDL3 and ffmpeg the binary links against.
      - name: Build devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          tags: aetherdesk-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and pack the client
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist && chmod 777 dist
          docker run --rm -v "$PWD:/w:ro" -v "$PWD/dist:/dist" -w /w \
            -e CARGO_TARGET_DIR=/tmp/target -e VERSION \
            aetherdesk-dev bash -c 'packaging/linux/release-tarball.sh "$VERSION" /dist'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
