name: Release

# Pushing a v* tag builds the Linux client and the Mac host and attaches
# both tarballs (with .sha256) to the GitHub release for that tag, created
# as a pre-release if it doesn't exist yet. The Homebrew casks are filled in
# from those afterwards: see docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Version and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the workspace version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          crate=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match workspace version $crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Once, here: two jobs creating it at the same time would race.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease
          fi

  linux-client:
    name: Linux client tarball
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Same image as CI: Arch, with the SDL3 and ffmpeg the binary links against.
      - name: Build devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          tags: aetherdesk-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and pack the client
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir -p dist && chmod 777 dist
          docker run --rm -v "$PWD:/w:ro" -v "$PWD/dist:/dist" -w /w \
            -e CARGO_TARGET_DIR=/tmp/target -e VERSION \
            aetherdesk-dev bash -c 'packaging/linux/release-tarball.sh "$VERSION" /dist'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  mac-host:
    name: Mac host tarball
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build, sign ad hoc and pack the host
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: packaging/macos/release-tarball.sh "$VERSION" dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
