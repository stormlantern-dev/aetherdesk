name: Release

# Pushing a v* tag builds the Linux client (tarball and Flatpak) and the Mac
# host (installer .pkg and tarball) and attaches them (with .sha256), plus
# the signed Sparkle appcast, to the GitHub release for that tag, created as
# a pre-release if it doesn't exist yet. The Homebrew casks are filled in
# from those afterwards, and the Appcast workflow publishes the appcast:
# see docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Version and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the workspace version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          crate=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match workspace version $crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Once, here: two jobs creating it at the same time would race.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease
          fi

  linux-client:
    name: Linux client tarball
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Same image as CI: Arch, with the SDL3 and ffmpeg the binary links against.
      - name: Build devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          tags: aetherdesk-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and pack the client
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir -p dist && chmod 777 dist
          docker run --rm -v "$PWD:/w:ro" -v "$PWD/dist:/dist" -w /w \
            -e CARGO_TARGET_DIR=/tmp/target -e VERSION \
            aetherdesk-dev bash -c 'packaging/linux/release-tarball.sh "$VERSION" /dist'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  linux-flatpak:
    name: Linux client Flatpak
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install flatpak-builder
        run: packaging/flatpak/ci-setup.sh
      - name: Build the bundle
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: packaging/flatpak/build.sh "$VERSION" dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  mac-host:
    name: Mac host (pkg, tarball, appcast)
    needs: release
    runs-on: macos-latest
    # The signing secrets and the Sparkle key live in this environment, which
    # only v* tags may use (Settings → Environments). See docs/RELEASING.md.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install
      # A throwaway keychain with only the two Developer ID certificates, and
      # the notary and Sparkle keys as files; all gone when the runner is.
      - name: Load the signing certificates and keys
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_PRIVATE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          for v in P12 P12_PASSWORD INSTALLER_P12 INSTALLER_P12_PASSWORD NOTARY_KEY_P8 \
                   NOTARY_KEY_ID NOTARY_ISSUER SPARKLE_PRIVATE SPARKLE_ED_PUBLIC_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is missing in the release environment (secret or variable): see docs/RELEASING.md"
              exit 1
            fi
          done
          keychain=$RUNNER_TEMP/signing.keychain-db
          kc_password=$(openssl rand -hex 24)
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          base64 --decode <<<"$P12" > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          base64 --decode <<<"$INSTALLER_P12" > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$INSTALLER_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/pkgbuild
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          base64 --decode <<<"$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          # As generate_keys -x writes it: one line of base64.
          (umask 077; printf '%s\n' "$SPARKLE_PRIVATE" > "$RUNNER_TEMP/sparkle.key")
          {
            echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER"
            echo "SPARKLE_ED_KEY_FILE=$RUNNER_TEMP/sparkle.key"
          } >> "$GITHUB_ENV"
      - name: Build, sign with Developer ID, notarize; pack as .pkg and tarball
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SIGNING: developer-id
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: packaging/macos/release.sh "$VERSION" dist
      - name: Check the package as Gatekeeper does
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          spctl --assess --type install --verbose=2 "dist/AetherDesk-$VERSION.pkg"
          pkgutil --check-signature "dist/AetherDesk-$VERSION.pkg"
      # Attached to the release only; the Appcast workflow publishes it when
      # the maintainer says so (docs/RELEASING.md).
      - name: Sign the appcast
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: packaging/macos/appcast.sh "dist/AetherDesk-$VERSION.pkg" dist/appcast.xml
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Remove the keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
