name: Devcontainer

# Only when the image itself changes; it takes a few minutes to build.
on:
  pull_request:
    paths: ['.devcontainer/**', '.github/workflows/devcontainer.yml']
  push:
    branches: [main]
    paths: ['.devcontainer/**', '.github/workflows/devcontainer.yml']

permissions:
  contents: read

jobs:
  image:
    name: devcontainer image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t aetherdesk-dev .devcontainer
      - name: Toolchain smoke test
        run: |
          docker run --rm aetherdesk-dev bash -lc \
            'rustc --version && pkg-config --modversion sdl3 libavcodec && rustup target list --installed'
      - name: Type-check macOS code inside the image
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w -e CARGO_TARGET_DIR=/tmp/target \
            aetherdesk-dev bash -c '
              set -e
              cargo check -p aetherdesk-mac-host --target aarch64-apple-darwin --locked
              cd spikes/m0 && cargo check --target aarch64-apple-darwin --locked'
