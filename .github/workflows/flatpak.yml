name: Flatpak

# Builds the client's Flatpak when its packaging changes, so a broken
# manifest shows up before a release. The release workflow builds it too.
on:
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - 'packaging/linux/**'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: flatpak (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install flatpak-builder
        run: packaging/flatpak/ci-setup.sh
      - name: Build the bundle
        run: packaging/flatpak/build.sh "0.0.0-ci" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: dist/
          retention-days: 7
