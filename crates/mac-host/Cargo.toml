[package]
name = "aetherdesk-mac-host"
description = "AetherDesk host for macOS: screen capture, encoding and input injection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aether-agent"
path = "src/main.rs"

[dependencies]
aetherdesk-proto = { workspace = true, features = ["quic", "still"] }
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "signal"] }
# Login at the login window over Screen Sharing (RFB, Apple DH type 30, #72).
# Pure Rust, so the module builds and its crypto is tested on Linux too.
aes = "0.8"
md-5 = "0.10"
num-bigint = "0.4"
zeroize.workspace = true


[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
getrandom.workspace = true
quinn.workspace = true
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-audio-toolbox = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSCursor", "NSImage", "NSGraphicsContext", "NSImageRep", "objc2-core-foundation", "objc2-core-graphics", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSScreen", "NSColor", "NSView", "NSControl", "NSTextField", "NSFont", "NSFontDescriptor", "NSEvent", "NSGraphics"] }
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-video-toolbox = "0.3"

[dev-dependencies]
# A paused clock, so tests of 35 s waits take no time.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
