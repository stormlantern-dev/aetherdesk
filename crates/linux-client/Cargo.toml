[package]
name = "auroval-linux-client"
description = "Auroval client for Linux (Wayland / Hyprland)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "auroval"
path = "src/main.rs"

[features]
# Test-only control socket (see src/testhooks.rs). Never in release builds.
test-hooks = ["dep:png"]

[dependencies]
auroval-proto = { workspace = true, features = ["quic", "still"] }

[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
quinn.workspace = true
rustls.workspace = true
png = { version = "0.18", optional = true }
sdl3 = "0.20"
tokio.workspace = true
ab_glyph = "0.2"
mdns-sd = { version = "0.21", default-features = false }

[dev-dependencies]
# Reading back saved pictures (src/dump.rs).
png = "0.18"

[lints]
workspace = true
