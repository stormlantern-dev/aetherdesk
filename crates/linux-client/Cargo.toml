[package]
name = "aetherdesk-linux-client"
description = "AetherDesk client for Linux (Wayland / Hyprland)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aetherdesk"
path = "src/main.rs"

[features]
# Test-only control socket (see src/testhooks.rs). Never in release builds.
test-hooks = ["dep:png"]

[dependencies]
aetherdesk-proto = { workspace = true, features = ["quic"] }

[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
quinn.workspace = true
rustls.workspace = true
png = { version = "0.18", optional = true }
sdl3 = "0.20"
tokio.workspace = true
mdns-sd = { version = "0.21", default-features = false }

[lints]
workspace = true
