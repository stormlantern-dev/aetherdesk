[package]
name = "aetherdesk-linux-client"
description = "AetherDesk client for Linux (Wayland / Hyprland)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aetherdesk"
path = "src/main.rs"

[dependencies]
aetherdesk-proto = { workspace = true, features = ["quic"] }

[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
quinn.workspace = true
rustls.workspace = true
sdl3 = "0.20"
tokio.workspace = true

[lints]
workspace = true
