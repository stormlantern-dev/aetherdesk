[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway and keep their own lockfile.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stormlantern-dev/aetherdesk"
publish = false

[workspace.dependencies]
aetherdesk-proto = { path = "crates/proto" }
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
